<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/colors.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/typography.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/spacing.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/motion.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/radius.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/shadows.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/layout.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/tokens/base.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/components/components.css">
<link rel="stylesheet" href="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/styles.css">
<script src="_ds/tailwind-universal-design-system-c6d1a8b6-4ac2-4d83-addd-2824ba32c0ed/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --paper: #ffffff; --ink: #0b0b0b; --line: rgba(11,11,11,.14); --hair: rgba(11,11,11,.08); }
  :root[data-asok="dark"] { --paper: #0a0a0a; --ink: #f7f7f5; --line: rgba(247,247,245,.18); --hair: rgba(247,247,245,.09); }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); }
  body { transition: background 420ms cubic-bezier(.2,0,0,1); }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--ink); }
  @keyframes asokRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes asokFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes asokSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: var(--paper); color: var(--ink); font-family: Archivo, 'Helvetica Neue', Helvetica, sans-serif; display: grid; grid-template-rows: auto 1fr auto; transition: background 420ms cubic-bezier(.2,0,0,1), color 420ms cubic-bezier(.2,0,0,1);">

  <div ref="{{ clockWrap }}" aria-hidden="true" style="position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; animation: asokFade 1400ms cubic-bezier(.2,0,0,1) 260ms forwards;">
    <svg ref="{{ clockSvg }}" viewBox="-500 -500 1000 1000" style="width: min(112vh, 96vw); height: min(112vh, 96vw); overflow: visible; display: block;">
      <g fill="none" stroke="var(--ink)" vector-effect="non-scaling-stroke">
        <circle r="470" stroke-width="1" opacity=".22"></circle>
        <circle r="430" stroke-width="1" opacity=".5" stroke-dasharray="2 41.03" stroke-dashoffset="1"></circle>
        <circle r="392" stroke-width="1" opacity=".14"></circle>
        <circle r="268" stroke-width="1" opacity=".2"></circle>
        <circle r="150" stroke-width="1" opacity=".1"></circle>
        <circle r="66" stroke-width="1" opacity=".28"></circle>
        <g opacity=".45" stroke-width="1">
          <line x1="0" y1="-392" x2="0" y2="-468"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(30)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(60)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(90)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(120)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(150)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(180)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(210)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(240)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(270)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(300)"></line>
          <line x1="0" y1="-392" x2="0" y2="-468" transform="rotate(330)"></line>
        </g>
        <g opacity=".3" stroke-width="1">
          <line x1="-500" y1="0" x2="-470" y2="0"></line>
          <line x1="470" y1="0" x2="500" y2="0"></line>
          <line x1="0" y1="-500" x2="0" y2="-470"></line>
          <line x1="0" y1="470" x2="0" y2="500"></line>
        </g>
      </g>
      <g ref="{{ secondHand }}" fill="none" stroke="var(--ink)" opacity=".3" style="animation: asokSweep 120s linear infinite; transform-origin: 0px 0px;">
        <line x1="0" y1="72" x2="0" y2="-436" stroke-width="1"></line>
        <circle r="3" cy="-436" fill="var(--ink)" stroke="none"></circle>
      </g>
      <g ref="{{ mainHand }}" style="transform-origin: 0px 0px;">
        <line x1="0" y1="104" x2="0" y2="-352" stroke="var(--ink)" stroke-width="3" opacity=".62"></line>
        <line x1="0" y1="-352" x2="0" y2="-402" stroke="var(--ink)" stroke-width="1" opacity=".62"></line>
        <circle r="26" cy="104" fill="none" stroke="var(--ink)" stroke-width="1" opacity=".4"></circle>
        <circle r="7" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5" opacity=".9"></circle>
        <circle r="2" fill="var(--ink)"></circle>
      </g>
    </svg>
  </div>

  <header style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: clamp(20px, 3.2vh, 34px) clamp(20px, 4vw, 56px); opacity: 0; animation: asokRise 700ms cubic-bezier(.2,0,0,1) 120ms forwards;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase;">Asok</span>
    <div style="display: flex; align-items: center; gap: clamp(16px, 2.4vw, 30px);">
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; padding-bottom: 2px; border-bottom: 1px solid transparent; transition: border-color 160ms cubic-bezier(.2,0,0,1), opacity 160ms;" style-hover="border-bottom: 1px solid var(--ink);">LinkedIn</a>
      <button type="button" onClick="{{ toggleTheme }}" aria-label="Toggle light and dark mode" style="width: 26px; height: 26px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; transition: border-color 160ms cubic-bezier(.2,0,0,1), transform 160ms cubic-bezier(.2,0,0,1);" style-hover="border-color: var(--ink); transform: rotate(-24deg);">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.25" fill="none" stroke="currentColor" stroke-width="1"></circle><path d="M6 .75A5.25 5.25 0 0 1 6 11.25z" fill="currentColor"></path></svg>
      </button>
    </div>
  </header>

  <main style="position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 clamp(20px, 4vw, 56px); min-height: 0; pointer-events: none;">
    <p style="margin: 0 0 clamp(14px, 2.4vh, 26px); max-width: 30ch; font-family: 'JetBrains Mono', monospace; font-size: clamp(10px, .78vw, 12px); line-height: 1.7; letter-spacing: .1em; text-transform: uppercase; opacity: 0; animation: asokRise 900ms cubic-bezier(.2,0,0,1) 900ms forwards;">Web designer focused on clear, useful and distinctive digital experiences.</p>
    <h1 style="margin: 0; font-size: clamp(2.4rem, 8.4vw, 11rem); font-weight: 600; line-height: .86; letter-spacing: -.045em; text-transform: uppercase; text-wrap: balance;">
      <span style="display: block; overflow: hidden;"><span style="display: block; opacity: 0; animation: asokRise 1100ms cubic-bezier(.2,0,0,1) 220ms forwards;">From Nepal.</span></span>
      <span style="display: block; overflow: hidden;"><span style="display: block; opacity: 0; animation: asokRise 1100ms cubic-bezier(.2,0,0,1) 360ms forwards;">Designing beyond</span></span>
      <span style="display: block; overflow: hidden;"><span style="display: block; opacity: 0; animation: asokRise 1100ms cubic-bezier(.2,0,0,1) 480ms forwards;">borders.</span></span>
    </h1>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-top: clamp(16px, 3vh, 34px); padding-bottom: clamp(14px, 2.6vh, 28px); border-top: 1px solid var(--hair); padding-top: clamp(12px, 2vh, 22px); opacity: 0; animation: asokRise 900ms cubic-bezier(.2,0,0,1) 680ms forwards;">
      <p style="margin: 0; max-width: 46ch; font-size: clamp(12px, 1.05vw, 17px); line-height: 1.4; letter-spacing: -.01em;">16 years of crafting digital experiences across ecommerce, real estate &amp; blockchain.</p>
      <span style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .55;">Kathmandu · 27.7&deg;N</span>
    </div>
  </main>

  <footer style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: clamp(12px, 2vh, 20px) clamp(20px, 4vw, 56px); border-top: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: 0; animation: asokFade 800ms cubic-bezier(.2,0,0,1) 1100ms forwards;">
    <span>&copy; asok.com.np</span>
    <span style="opacity: .6;">All rights reserved.</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;clockScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.7,&quot;max&quot;:1.6,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Clock&quot;},&quot;inertia&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.05,&quot;max&quot;:0.9,&quot;step&quot;:0.05,&quot;default&quot;:0.42,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Clock&quot;},&quot;showSecondHand&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Clock&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.mainHand = React.createRef();
    this.secondHand = React.createRef();
    this.clockSvg = React.createRef();
    this.clockWrap = React.createRef();
    this.angle = -28;
    this.target = -28;
    this.vel = 0;
    this.drift = 0;
    this.pointer = false;
  }

  componentDidMount() {
    this.applyTheme(this.props.theme ?? "light");
    const s = this.props.clockScale ?? 1;
    if (this.clockSvg.current && s !== 1) this.clockSvg.current.style.transform = "scale(" + s + ")";
    if (this.clockSvg.current && this.props.showSecondHand === false && this.secondHand.current) {
      this.secondHand.current.style.display = "none";
    }
    this.onMove = (e) => {
      const r = this.clockWrap.current && this.clockWrap.current.getBoundingClientRect();
      if (!r) return;
      this.pointer = true;
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      let a = Math.atan2(dx, -dy) * 180 / Math.PI;
      const prev = this.target;
      while (a - prev > 180) a -= 360;
      while (a - prev < -180) a += 360;
      this.target = a;
    };
    window.addEventListener("pointermove", this.onMove, { passive: true });

    const damp = 1 - Math.min(0.9, Math.max(0.02, this.props.inertia ?? 0.42));
    const tick = (t) => {
      if (!this.pointer) {
        this.drift += 0.0022;
        this.target = Math.sin(this.drift) * 46 + Math.sin(this.drift * 0.41) * 24;
      }
      this.vel += (this.target - this.angle) * 0.055;
      this.vel *= 0.76 + damp * 0.16;
      this.angle += this.vel;
      if (this.mainHand.current) {
        this.mainHand.current.style.transform = "rotate(" + this.angle.toFixed(3) + "deg)";
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    window.removeEventListener("pointermove", this.onMove);
    cancelAnimationFrame(this.raf);
  }

  applyTheme(mode) {
    document.documentElement.setAttribute("data-asok", mode);
    this.mode = mode;
  }

  renderVals() {
    return {
      mainHand: this.mainHand,
      secondHand: this.secondHand,
      clockSvg: this.clockSvg,
      clockWrap: this.clockWrap,
      toggleTheme: () => this.applyTheme(this.mode === "dark" ? "light" : "dark")
    };
  }
}
</script>
</body>
